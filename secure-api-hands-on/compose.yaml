services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secureapi}
      POSTGRES_USER: ${POSTGRES_USER:-secureapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureapi-local-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureapi} -d ${POSTGRES_DB:-secureapi}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./app
    command: uv run python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-only-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      POSTGRES_DB: ${POSTGRES_DB:-secureapi}
      POSTGRES_USER: ${POSTGRES_USER:-secureapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureapi-local-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ACCESS_TOKEN_LIFETIME_MINUTES: ${ACCESS_TOKEN_LIFETIME_MINUTES:-30}
      REFRESH_TOKEN_LIFETIME_MINUTES: ${REFRESH_TOKEN_LIFETIME_MINUTES:-1440}
      LOGIN_RATE: ${LOGIN_RATE:-5/min}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com}
      INSECURE_NO_AUTH: ${INSECURE_NO_AUTH:-0}
      INSECURE_OBJECT_ACCESS: ${INSECURE_OBJECT_ACCESS:-0}
      INSECURE_OBJECT_PERMISSION: ${INSECURE_OBJECT_PERMISSION:-0}
      INSECURE_MASS_ASSIGNMENT: ${INSECURE_MASS_ASSIGNMENT:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
